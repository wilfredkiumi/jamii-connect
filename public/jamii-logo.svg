<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16A34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" stroke="white" stroke-width="2"/>
  
  <!-- Connecting lines representing community -->
  <g stroke="white" stroke-width="1.5" fill="none">
    <!-- Center node -->
    <circle cx="20" cy="20" r="2" fill="white"/>
    
    <!-- Connected nodes -->
    <circle cx="12" cy="14" r="1.5" fill="white"/>
    <circle cx="28" cy="14" r="1.5" fill="white"/>
    <circle cx="12" cy="26" r="1.5" fill="white"/>
    <circle cx="28" cy="26" r="1.5" fill="white"/>
    
    <!-- Connecting lines -->
    <line x1="20" y1="20" x2="12" y2="14"/>
    <line x1="20" y1="20" x2="28" y2="14"/>
    <line x1="20" y1="20" x2="12" y2="26"/>
    <line x1="20" y1="20" x2="28" y2="26"/>
    
    <!-- Outer connection lines -->
    <line x1="12" y1="14" x2="28" y2="14"/>
    <line x1="12" y1="26" x2="28" y2="26"/>
  </g>
</svg>
